<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>eFootball Mini-League | Season Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060810;
    --bg-panel: #0e1220;
    --bg-panel-2: #121729;
    --line: #1e2740;
    --blue: #00d4ff;
    --blue-dim: #0a7ca8;
    --pink: #ff2fb0;
    --pink-dim: #a01c72;
    --green: #29ffb0;
    --amber: #ffcf40;
    --red: #ff4d6d;
    --text: #e8ecf7;
    --text-dim: #8a93b3;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,212,255,.10), transparent 60%),
      radial-gradient(1200px 700px at 110% 10%, rgba(255,47,176,.10), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px),
      radial-gradient(1200px 600px at 15% -10%, rgba(0,212,255,.10), transparent 60%),
      radial-gradient(1200px 700px at 110% 10%, rgba(255,47,176,.10), transparent 55%),
      linear-gradient(var(--bg),var(--bg));
    background-size: 34px 34px, 34px 34px, auto, auto, auto;
  }
  h1,h2,h3,h4{font-family:'Orbitron',sans-serif; margin:0; letter-spacing:.5px;}
  .neon-blue{color:var(--blue); text-shadow:0 0 12px rgba(0,212,255,.55);}
  .neon-pink{color:var(--pink); text-shadow:0 0 12px rgba(255,47,176,.55);}
  ::selection{background:var(--pink); color:#000;}
  a{color:var(--blue);}
  button{font-family:'Rajdhani',sans-serif; cursor:pointer;}
  input,select,textarea{font-family:'Rajdhani',sans-serif;}

  /* ---------- layout ---------- */
  #root{min-height:100vh; display:flex; flex-direction:column;}
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(14,18,32,.9), rgba(14,18,32,.55));
    backdrop-filter: blur(6px);
    position:sticky; top:0; z-index:50;
    flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:38px;height:38px;border-radius:10px;
    background:conic-gradient(from 220deg, var(--blue), var(--pink), var(--blue));
    display:flex;align-items:center;justify-content:center;
    font-family:'Orbitron'; font-weight:900; font-size:14px; color:#04060c;
    box-shadow:0 0 18px rgba(0,212,255,.45), 0 0 18px rgba(255,47,176,.25) inset;
  }
  .brand h1{font-size:18px;}
  .brand h1 span{display:block; font-size:10px; letter-spacing:3px; color:var(--text-dim); font-family:'Rajdhani'; font-weight:600;}
  .who{display:flex; align-items:center; gap:12px;}
  .who .pill{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px 6px 6px; font-size:14px; font-weight:600;
  }
  .who .pill .dot{width:26px;height:26px;border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--pink)); flex:none;}
  .btn{
    border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text);
    padding:8px 16px; border-radius:10px; font-weight:700; font-size:14px; letter-spacing:.3px;
    transition:.15s ease; white-space:nowrap;
  }
  .btn:hover{border-color:var(--blue); box-shadow:0 0 14px rgba(0,212,255,.3); color:var(--blue);}
  .btn.primary{
    background:linear-gradient(135deg, var(--blue), #0088c8); color:#04121a; border:none;
    box-shadow:0 0 16px rgba(0,212,255,.4);
  }
  .btn.primary:hover{box-shadow:0 0 22px rgba(0,212,255,.65); color:#04121a;}
  .btn.pink{
    background:linear-gradient(135deg, var(--pink), #a01c72); color:#1a0410; border:none;
    box-shadow:0 0 16px rgba(255,47,176,.4);
  }
  .btn.pink:hover{box-shadow:0 0 22px rgba(255,47,176,.65);}
  .btn.ghost{background:transparent;}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:8px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .tabs{
    display:flex; gap:6px; padding:10px 22px; overflow-x:auto;
    border-bottom:1px solid var(--line); background:rgba(10,13,24,.6);
    position:sticky; top:66px; z-index:40;
  }
  .tab{
    border:1px solid transparent; background:transparent; color:var(--text-dim);
    padding:8px 14px; border-radius:10px; font-weight:700; font-size:13px;
    letter-spacing:.4px; white-space:nowrap; text-transform:uppercase;
  }
  .tab.active{
    color:var(--bg); background:linear-gradient(135deg, var(--blue), var(--pink));
    box-shadow:0 0 16px rgba(0,212,255,.35);
  }
  .tab:hover:not(.active){color:var(--blue); border-color:var(--line);}

  main{flex:1; padding:22px; max-width:1180px; margin:0 auto; width:100%;}
  .grid{display:grid; gap:18px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:860px){ .grid.cols-2, .grid.cols-3{grid-template-columns:1fr;} }

  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg, var(--blue), var(--pink));
    opacity:.7;
  }
  .card h3{font-size:14px; text-transform:uppercase; letter-spacing:2px; color:var(--text-dim); margin-bottom:12px;}
  .section-title{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .section-title h2{font-size:20px;}
  .section-title .bar{width:6px; height:22px; background:linear-gradient(var(--blue),var(--pink)); border-radius:4px;}

  /* ---------- badges ---------- */
  .badge{
    width:64px; height:70px; clip-path:polygon(50% 0%,100% 16%,100% 58%,50% 100%,0% 58%,0% 16%);
    display:flex; align-items:center; justify-content:center; flex:none;
    box-shadow:0 0 14px rgba(0,0,0,.5), 0 0 10px rgba(0,212,255,.15) inset;
    border:1px solid rgba(255,255,255,.18);
  }
  .badge span{font-family:'Orbitron'; font-weight:900; font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.6); color:#fff;}
  .badge.sm{width:36px; height:40px;}
  .badge.sm span{font-size:9px;}
  .badge.lg{width:96px; height:106px;}
  .badge.lg span{font-size:18px;}
  .team-flamengo{background:linear-gradient(135deg,#e30613 45%,#0a0a0a 45%);}
  .team-chelsea{background:linear-gradient(135deg,#034694,#1e6fd6);}
  .team-intermiami{background:linear-gradient(135deg,#f7b5cd,#231f20 75%);}
  .team-intermiami span{color:#231f20; text-shadow:0 1px 2px rgba(255,255,255,.4);}
  .team-kawasaki{background:linear-gradient(135deg,#0033a0,#00aeef);}
  .team-acmilan{background:linear-gradient(135deg,#fb090b 45%,#0a0a0a 45%);}
  .team-northkorea{background:linear-gradient(135deg,#024fa2 50%,#ed1c24 50%);}

  .player-row{display:flex; align-items:center; gap:12px;}
  .player-row .meta .name{font-weight:700; font-size:15px;}
  .player-row .meta .team{color:var(--text-dim); font-size:12.5px;}

  /* ---------- dashboard ---------- */
  .hero{
    display:flex; align-items:center; gap:20px; padding:24px;
    background:linear-gradient(120deg, rgba(0,212,255,.08), rgba(255,47,176,.08));
    border:1px solid var(--line); border-radius:var(--radius); margin-bottom:20px; flex-wrap:wrap;
  }
  .hero .info h2{font-size:24px;}
  .hero .info p{margin:4px 0 0; color:var(--text-dim); font-size:14px;}
  .stat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:14px;}
  @media (max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
  .stat-box{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px; text-align:center;
  }
  .stat-box .val{font-family:'Orbitron'; font-size:22px; font-weight:700; color:var(--blue);}
  .stat-box .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{padding:10px 8px; text-align:center; border-bottom:1px solid var(--line);}
  th{color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  td.name-cell, th.name-cell{text-align:left;}
  tbody tr:hover{background:rgba(0,212,255,.05);}
  tr.me{background:rgba(255,47,176,.08);}
  tr.top3 td:first-child{color:var(--green); font-weight:800;}
  .table-wrap{overflow-x:auto;}

  /* ---------- fixtures ---------- */
  .round-block{margin-bottom:22px;}
  .round-head{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
    font-family:'Orbitron'; font-size:13px; color:var(--text-dim); letter-spacing:1.5px;
  }
  .round-head::after{content:""; flex:1; height:1px; background:var(--line);}
  .match-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; flex-wrap:wrap;
  }
  .match-side{display:flex; align-items:center; gap:8px; min-width:150px; font-weight:700; font-size:13.5px;}
  .match-side.away{flex-direction:row-reverse; text-align:right;}
  .match-score{
    display:flex; align-items:center; gap:8px; font-family:'Orbitron'; font-weight:700; font-size:16px;
  }
  .match-score input{
    width:38px; text-align:center; background:var(--bg); border:1px solid var(--line); color:var(--blue);
    border-radius:6px; padding:5px 2px; font-family:'Orbitron'; font-size:14px;
  }
  .match-score input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 8px rgba(0,212,255,.4);}
  .score-pill{background:var(--bg); border:1px solid var(--line); padding:4px 10px; border-radius:8px; min-width:52px; text-align:center;}
  .played-tag{font-size:10px; color:var(--green); text-transform:uppercase; letter-spacing:1px;}
  .pending-tag{font-size:10px; color:var(--amber); text-transform:uppercase; letter-spacing:1px;}

  /* ---------- forms ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--pink); box-shadow:0 0 10px rgba(255,47,176,.3);}
  .field textarea{min-height:90px; resize:vertical;}

  /* ---------- login ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:460px; background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line); border-radius:18px; padding:30px; box-shadow:0 0 40px rgba(0,212,255,.08);
  }
  .login-card h1{font-size:22px; text-align:center;}
  .login-card .sub{text-align:center; color:var(--text-dim); font-size:13px; margin-top:6px; margin-bottom:24px;}
  .role-choice{display:flex; gap:12px; margin-bottom:18px;}
  .role-choice button{
    flex:1; padding:16px 10px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text); font-weight:800; font-size:14px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .role-choice button.active{
    border-color:var(--blue); color:var(--blue); box-shadow:0 0 14px rgba(0,212,255,.3);
  }
  .player-pick-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
  .player-pick{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg-panel-2); text-align:left;
  }
  .player-pick.active{border-color:var(--pink); box-shadow:0 0 12px rgba(255,47,176,.35);}
  .player-pick .meta .name{font-size:13px; font-weight:700;}
  .player-pick .meta .team{font-size:10.5px; color:var(--text-dim);}
  .error-msg{color:var(--red); font-size:13px; margin-top:8px; text-align:center;}
  .hint{font-size:11.5px; color:var(--text-dim); text-align:center; margin-top:14px;}

  /* ---------- achievements ---------- */
  .achv-card{display:flex; align-items:center; gap:16px;}
  .achv-icon{
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:26px; flex:none;
  }
  .achv-icon.boot{background:linear-gradient(135deg, var(--amber), #a67300);}
  .achv-icon.glove{background:linear-gradient(135deg, var(--blue), #0088c8);}
  .achv-title{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px;}
  .achv-name{font-family:'Orbitron'; font-size:17px; margin-top:2px;}
  .achv-detail{font-size:12.5px; color:var(--text-dim); margin-top:2px;}

  /* ---------- inbox ---------- */
  .report-item{
    border:1px solid var(--line); background:var(--bg-panel-2); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .report-item.resolved{opacity:.5;}
  .report-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .report-head .tag{font-size:10px; text-transform:uppercase; letter-spacing:1px; padding:3px 9px; border-radius:999px; background:rgba(255,47,176,.15); color:var(--pink); border:1px solid var(--pink-dim);}
  .report-head .tag.res{background:rgba(41,255,176,.12); color:var(--green); border-color:#1a7a55;}
  .report-body{font-size:13.5px; margin-top:8px; color:var(--text);}
  .report-foot{font-size:11.5px; color:var(--text-dim); margin-top:8px;}
  .empty-state{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13.5px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,6,12,.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .modal-box{
    width:100%; max-width:420px; background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line); border-radius:var(--radius); padding:22px;
    box-shadow:0 0 40px rgba(255,47,176,.15);
  }
  .modal-box h3{font-size:16px; margin-bottom:10px;}
  .modal-box p{font-size:14px; color:var(--text-dim); line-height:1.5; margin:0 0 18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg, var(--blue), var(--pink)); color:#04060c;
    padding:11px 22px; border-radius:999px; font-weight:800; font-size:13px; letter-spacing:.5px;
    box-shadow:0 4px 24px rgba(0,0,0,.5); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  footer{text-align:center; padding:16px; color:var(--text-dim); font-size:11.5px; border-top:1px solid var(--line);}

  /* ---------- notification bell ---------- */
  .bell-wrap{position:relative; display:inline-flex;}
  .bell-btn{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
    width:40px; height:40px; border-radius:10px; font-size:17px; display:flex; align-items:center; justify-content:center;
  }
  .bell-btn:hover{border-color:var(--blue); color:var(--blue);}
  .bell-badge{
    position:absolute; top:-6px; right:-6px; background:var(--pink); color:#1a0410;
    font-family:'Orbitron'; font-weight:800; font-size:10px; min-width:18px; height:18px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 4px; box-shadow:0 0 8px rgba(255,47,176,.6);
  }

  /* ---------- team picker dialog ---------- */
  .team-picker-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-height:56vh; overflow-y:auto; padding:2px;
  }
  @media (max-width:640px){ .team-picker-grid{grid-template-columns:repeat(2,1fr);} }
  .team-pick-item{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 6px;
    border:1px solid var(--line); background:var(--bg-panel-2); border-radius:10px; text-align:center;
  }
  .team-pick-item:hover{border-color:var(--pink); box-shadow:0 0 10px rgba(255,47,176,.3);}
  .team-pick-item .tname{font-size:10.5px; font-weight:700; line-height:1.2;}
  .selected-team-preview{
    display:flex; align-items:center; gap:10px; background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-top:6px;
  }

  /* ---------- penalty box ---------- */
  .penalty-item{
    border:1px solid var(--pink-dim); background:rgba(255,47,176,.06); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .penalty-item .pts{font-family:'Orbitron'; color:var(--pink); font-weight:800;}

  /* ---------- roster requests ---------- */
  .request-item{
    border:1px solid var(--line); background:var(--bg-panel-2); border-radius:10px;
    padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .request-arrow{color:var(--text-dim); font-size:18px;}
  .roster-list{display:flex; flex-wrap:wrap; gap:10px;}
  .roster-chip{
    display:flex; align-items:center; gap:8px; background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px 5px 5px; font-size:12.5px; font-weight:700;
  }

  /* ---------- signup form on login page ---------- */
  .signup-toggle{
    display:block; width:100%; text-align:center; margin-top:16px; background:none; border:none;
    color:var(--blue); font-size:12.5px; font-weight:700; text-decoration:underline; letter-spacing:.5px;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase (Realtime Database) — shared live data source -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ======================= DATA ======================= */
const DEFAULT_PLAYERS = [
  { id:1, name:'Eston',       team:'Flamengo',           colorA:'#e30613', colorB:'#0a0a0a', textColor:'#ffffff', init:'FLA' },
  { id:2, name:'Benja',       team:'Chelsea',             colorA:'#034694', colorB:'#1e6fd6', textColor:'#ffffff', init:'CHE' },
  { id:3, name:'Deno',        team:'Inter Miami',         colorA:'#f7b5cd', colorB:'#231f20', textColor:'#231f20', init:'IMI' },
  { id:4, name:'Junior',      team:'Kawasaki Frontale',   colorA:'#0033a0', colorB:'#00aeef', textColor:'#ffffff', init:'KAW' },
  { id:5, name:'Pentans guy', team:'AC Milan',            colorA:'#fb090b', colorB:'#0a0a0a', textColor:'#ffffff', init:'ACM' },
  { id:6, name:'Mike',        team:'North Korea',         colorA:'#024fa2', colorB:'#ed1c24', textColor:'#ffffff', init:'PRK' },
];

/* Catalog of well-known clubs/national teams offered for team-change & new-player requests.
   Colors are generic brand-tone gradients — no crests, logos or copyrighted artwork. */
const TEAM_CATALOG = [
  { name:'Real Madrid',        colorA:'#ffffff', colorB:'#febe10', textColor:'#1a1a1a', init:'RMA' },
  { name:'Barcelona',          colorA:'#a50044', colorB:'#004d98', textColor:'#ffffff', init:'BAR' },
  { name:'Manchester City',    colorA:'#6cabdd', colorB:'#1c2c5b', textColor:'#ffffff', init:'MCI' },
  { name:'Manchester United',  colorA:'#da291c', colorB:'#000000', textColor:'#ffffff', init:'MUN' },
  { name:'Liverpool',          colorA:'#c8102e', colorB:'#00b2a9', textColor:'#ffffff', init:'LIV' },
  { name:'Arsenal',            colorA:'#ef0107', colorB:'#023474', textColor:'#ffffff', init:'ARS' },
  { name:'Tottenham Hotspur',  colorA:'#132257', colorB:'#ffffff', textColor:'#132257', init:'TOT' },
  { name:'Bayern Munich',      colorA:'#dc052d', colorB:'#0066b2', textColor:'#ffffff', init:'BAY' },
  { name:'Borussia Dortmund',  colorA:'#fde100', colorB:'#000000', textColor:'#111111', init:'BVB' },

/* ======================= FIXTURE GENERATION (circle method, works for ANY roster size) ======================= */
function generateFixturesForRoster(playerIds){
  let ids = [...playerIds];
  if(ids.length < 2) return [];
  if(ids.length % 2 !== 0) ids.push(null); // odd roster size gets a "bye" each round
  const n = ids.length;
  const fixed = ids[0];
  let rotating = ids.slice(1);
  const firstLeg = [];
  for(let r=0; r<n-1; r++){
    const round = [fixed, ...rotating];
    const matches = [];
    for(let i=0;i<n/2;i++){
      let home = round[i], away = round[n-1-i];
      if(home === null || away === null) continue; // this player has a bye this round
      if(r % 2 === 1) [home, away] = [away, home];
      matches.push({ home, away });
    }
    firstLeg.push(matches);
    rotating.push(rotating.shift());
  }
  const secondLeg = firstLeg.map(round => round.map(m => ({ home: m.away, away: m.home })));
  const allRounds = [...firstLeg, ...secondLeg];
  const fixtures = [];
  let matchId = 1;
  allRounds.forEach((round, ri) => {
    round.forEach(m => {
      fixtures.push({ id: matchId++, round: ri + 1, home: m.home, away: m.away, homeScore: null, awayScore: null });
    });
  });
  return fixtures;
}
function generateFixtures(){ return generateFixturesForRoster(PLAYERS.map(p => p.id)); }

/* ======================= STANDINGS / ACHIEVEMENTS ======================= */
function headToHeadPoints(idA, idB){
  let ptsA = 0, ptsB = 0;
  fixtures.forEach(f => {
    if(!isPlayed(f)) return;
    if(f.home === idA && f.away === idB){
      if(f.homeScore > f.awayScore) ptsA += 3; else if(f.homeScore < f.awayScore) ptsB += 3; else { ptsA++; ptsB++; }
    } else if(f.home === idB && f.away === idA){
      if(f.homeScore > f.awayScore) ptsB += 3; else if(f.homeScore < f.awayScore) ptsA += 3; else { ptsA++; ptsB++; }
    }
  });
  return { ptsA, ptsB };
}

function penaltyPointsFor(playerId){
  return penalties.filter(pn => pn.playerId === playerId).reduce((sum, pn) => sum + pn.points, 0);
}

function computeStandings(){
  const stats = {};
  PLAYERS.forEach(p => stats[p.id] = { id:p.id, name:p.name, team:p.team, p:0, w:0, d:0, l:0, gf:0, ga:0 });
  fixtures.forEach(f => {
    if(!isPlayed(f)) return;
    const h = stats[f.home], a = stats[f.away];
    if(!h || !a) return; // fixture references a player no longer on the active roster
    h.p++; a.p++;
    h.gf += f.homeScore; h.ga += f.awayScore;
    a.gf += f.awayScore; a.ga += f.homeScore;
    if(f.homeScore > f.awayScore){ h.w++; a.l++; }
    else if(f.homeScore < f.awayScore){ a.w++; h.l++; }
    else { h.d++; a.d++; }
  });
  const arr = Object.values(stats).map(s => {
    const penaltyPts = penaltyPointsFor(s.id);
    return { ...s, gd: s.gf - s.ga, pts: s.w * 3 + s.d - penaltyPts, penaltyPts };
  });
  arr.sort((x,y) => {
    if(y.pts !== x.pts) return y.pts - x.pts;
    const h2h = headToHeadPoints(x.id, y.id);
    if(h2h.ptsB !== h2h.ptsA) return h2h.ptsB - h2h.ptsA;
    if(y.gd !== x.gd) return y.gd - x.gd;
    if(y.gf !== x.gf) return y.gf - x.gf;
    return x.name.localeCompare(y.name);
  });
  return arr;
}

function computeAchievements(standings){
  const played = standings.filter(s => s.p > 0);
  if(played.length === 0) return { boot:null, glove:null };
  const maxGf = Math.max(...played.map(s => s.gf));
  const minGa = Math.min(...played.map(s => s.ga));
  const boot = played.filter(s => s.gf === maxGf && maxGf > 0);
  const glove = played.filter(s => s.ga === minGa);
  return { boot, glove };
}

  const penaltyNote = s.penaltyPts > 0 ? `<p style="color:var(--pink); font-size:12.5px; margin-top:6px;">&minus;${s.penaltyPts} pts from penalties this season &mdash; see Standings for details.</p>` : '';

    <div class="hero">
      ${badgeHtml(me,'lg')}
      <div class="info">
        <h2>Welcome back, <span class="neon-blue">${esc(me.name)}</span></h2>
        <p>Managing <strong>${esc(me.team)}</strong> this season &middot; Rank #${rank} of ${PLAYERS.length}</p>
        ${penaltyNote}
        <div class="stat-grid">
          <div class="stat-box"><div class="val">${s.p}</div><div class="lbl">Played</div></div>
          <div class="stat-box"><div class="val">${winRate}%</div><div class="lbl">Win Rate</div></div>
          <div class="stat-box"><div class="val">${s.gf}</div><div class="lbl">Goals Scored</div></div>
          <div class="stat-box"><div class="val">${s.ga}</div><div class="lbl">Conceded</div></div>
          <div class="stat-box"><div class="val">${s.pts}</div><div class="lbl">Points</div></div>
        </div>
      </div>
    </div>
    <div class="grid cols-2">
      <div class="card">
        <h3>Your Record</h3>
        <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-box"><div class="val" style="color:var(--green)">${s.w}</div><div class="lbl">Wins</div></div>
          <div class="stat-box"><div class="val" style="color:var(--amber)">${s.d}</div><div class="lbl">Draws</div></div>
          <div class="stat-box"><div class="val" style="color:var(--red)">${s.l}</div><div class="lbl">Losses</div></div>
        </div>
      </div>
      ${shareCard(standings)}
    </div>
  `;
}

function shareCard(standings){
  const top3 = standings.slice(0,3);
  const lines = top3.map((s,i) => `${i+1}. ${s.name} (${s.team}) - ${s.pts} pts`).join('%0A');
  const link = getShareLink();
  const linkLine = link ? `%0A%0ACheck the full live standings here: ${encodeURIComponent(link)}` : '';
  const message = `*eFootball Mini-League - Table Update* %0A%0A${lines}${linkLine}%0A%0AGGWP! ⚽🔥`;
  return `
    <div class="card">
      <h3>Share With The Group</h3>
      <p style="font-size:13.5px; color:var(--text-dim); margin:0 0 12px;">Send the current Top 3 straight to your WhatsApp group chat.${link ? '' : ' <em>No league link set yet &mdash; the admin can add one in the Admin Panel.</em>'}</p>
      <button class="btn pink" style="width:100%" data-action="whatsapp-share" data-msg="${message}">Share to WhatsApp Group</button>
    </div>
  `;
}

/* ======================= STANDINGS ======================= */
function standingsHtml(isAdmin, me){
  const standings = computeStandings();
  const rows = standings.map((s,i) => `
    <tr class="${!isAdmin && me && s.id===me.id ? 'me' : ''} ${i<3?'top3':''}">
      <td>${i+1}</td>
      <td class="name-cell"><div class="player-row">${badgeHtml(playerById(s.id) || {colorA:'#333',colorB:'#111',init:'?'},'sm')}<div class="meta"><div class="name">${esc(s.name)}</div></div></div></td>
      <td>${esc(s.team)}</td>
      <td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td>
      <td>${s.gf}</td><td>${s.ga}</td><td>${s.gd>0?'+':''}${s.gd}</td>
      <td style="font-weight:800; color:var(--blue);">${s.pts}${s.penaltyPts>0?`<span style="color:var(--pink); font-size:11px; font-weight:700;"> (&minus;${s.penaltyPts})</span>`:''}</td>
    </tr>`).join('');

  const penaltyList = penalties.length ? penalties.map(pn => {
    const p = playerById(pn.playerId);
    return `<div class="penalty-item">
      <div><strong>${esc(p ? p.name : 'Unknown player')}</strong> &mdash; ${esc(pn.reason)}</div>
      <div class="pts">&minus;${pn.points} pts</div>
    </div>`;
  }).join('') : '';

  return `
    <div class="section-title"><div class="bar"></div><h2>Live Standings</h2></div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th class="name-cell">Player</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p style="font-size:11.5px; color:var(--text-dim); margin:14px 0 0;">Tiebreakers, in order: Points &rarr; Head-to-head record &rarr; Goal Difference &rarr; Goals For &rarr; Alphabetical. Points already reflect any penalty deductions.</p>
    </div>
    ${penaltyList ? `<div class="section-title" style="margin-top:20px;"><div class="bar"></div><h2>Season Penalties</h2></div><div class="card">${penaltyList}</div>` : ''}
  `;
}

/* ======================= FIXTURES ======================= */
function fixturesHtml(isAdmin, me){
  const showMineOnly = !isAdmin && me && fixturesFilterMine;
  const source = showMineOnly ? fixtures.filter(f => f.home === me.id || f.away === me.id) : fixtures;
  const rounds = {};
  source.forEach(f => { (rounds[f.round] = rounds[f.round] || []).push(f); });

  const blocks = Object.keys(rounds).sort((a,b)=>a-b).map(r => {
    const matches = rounds[r].map(f => {
      const home = playerById(f.home), away = playerById(f.away);
      if(!home || !away) return ''; // player no longer on roster
      const played = isPlayed(f);
      let scoreArea;
      if(isAdmin){
        scoreArea = `
          <div class="match-score">
            <input type="number" min="0" max="99" data-action="score-input" data-fixture="${f.id}" data-side="home" value="${played?f.homeScore:''}">
            <span>:</span>
            <input type="number" min="0" max="99" data-action="score-input" data-fixture="${f.id}" data-side="away" value="${played?f.awayScore:''}">
            <button class="btn small primary" data-action="save-score" data-fixture="${f.id}">Save</button>
          </div>`;
      } else {
        scoreArea = played
          ? `<div class="match-score"><span class="score-pill">${f.homeScore} : ${f.awayScore}</span></div>`
          : `<div class="match-score"><span class="score-pill">vs</span></div>`;
      }
      return `
        <div class="match-row">
          <div class="match-side">${badgeHtml(home,'sm')} ${esc(home.name)}</div>
          ${scoreArea}
          <div class="match-side away">${badgeHtml(away,'sm')} ${esc(away.name)}</div>
          <div style="width:100%; text-align:center;">${played ? '<span class="played-tag">Played</span>' : '<span class="pending-tag">Pending</span>'}</div>
        </div>`;
    }).join('');
    return `<div class="round-block"><div class="round-head">ROUND ${r}</div>${matches}</div>`;
  }).join('');

  const filterToggle = !isAdmin ? `
    <div style="display:flex; gap:8px; margin-bottom:18px;">
      <button class="tab ${!showMineOnly?'active':''}" data-action="toggle-my-fixtures" data-mine="false">All Fixtures</button>
      <button class="tab ${showMineOnly?'active':''}" data-action="toggle-my-fixtures" data-mine="true">My Fixtures</button>
    </div>` : '';

  return `
    <div class="section-title"><div class="bar"></div><h2>Match Schedule &amp; Fixtures</h2></div>
    ${filterToggle}
    ${blocks.length ? blocks : '<div class="card empty-state">No fixtures to show.</div>'}
  `;
}

/* ======================= ACHIEVEMENTS ======================= */

  const standings = computeStandings();
  const { boot, glove } = computeAchievements(standings);

  const bootHtml = boot ? boot.map(s => `
    <div class="card achv-card">
      <div class="achv-icon boot">👟</div>
      <div>
        <div class="achv-title">Golden Boot &middot; Top Scorer</div>
        <div class="achv-name">${esc(s.name)} <span style="color:var(--text-dim); font-weight:400; font-size:13px;">(${esc(s.team)})</span></div>
        <div class="achv-detail">${s.gf} goals scored across ${s.p} matches</div>
      </div>
    </div>`).join('') : `<div class="card empty-state">No goals scored yet &mdash; Golden Boot is up for grabs.</div>`;

  const gloveHtml = glove ? glove.map(s => `
    <div class="card achv-card">
      <div class="achv-icon glove">🧤</div>
      <div>
        <div class="achv-title">Golden Glove &middot; Best Defense</div>
        <div class="achv-name">${esc(s.name)} <span style="color:var(--text-dim); font-weight:400; font-size:13px;">(${esc(s.team)})</span></div>

  return `
    <div class="section-title"><div class="bar"></div><h2>Season Achievements</h2></div>

/* ======================= REPORT (USER) ======================= */
function reportHtml(me){
  const otherPlayers = PLAYERS.filter(p => p.id !== me.id);
  const options = otherPlayers.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(p.team)})</option>`).join('');
  const fixtureOptions = fixtures.map(f => {
    const h = playerById(f.home), a = playerById(f.away);
    if(!h || !a) return '';
    return `<option value="${f.id}">Round ${f.round}: ${esc(h.name)} vs ${esc(a.name)}</option>`;
  }).join('');

  const myReports = reports.filter(r => r.reportingUser === me.name);
  const myReportsHtml = myReports.length ? myReports.map(r => {
    const reportedPlayer = playerById(r.reportedPlayerId);
    return `
      <div class="report-item ${r.resolved ? 'resolved' : ''}">
        <div class="report-head">
          <strong>Re: ${esc(reportedPlayer ? reportedPlayer.name : 'Unknown')}</strong>
          <span class="tag ${r.resolved ? 'res' : ''}">${r.resolved ? 'Resolved' : 'Pending'}</span>
        </div>
        <div class="report-body">${esc(r.details)}</div>
        <div class="report-foot">${new Date(r.createdAt).toLocaleString()}</div>
        ${r.reply ? `<div class="report-body" style="margin-top:10px; border-top:1px solid var(--line); padding-top:10px;"><strong style="color:var(--blue);">Admin reply:</strong> ${esc(r.reply.text)}</div>` : ''}
      </div>`;
  }).join('') : `<div class="empty-state">You haven't filed any reports.</div>`;

  return `
    <div class="section-title"><div class="bar"></div><h2>Report an Issue / Cheating</h2></div>
    <div class="grid cols-2">
      <div class="card">
        <h3>Submit a Report</h3>
        <div class="field"><label>Reporting User</label><input type="text" value="${esc(me.name)}" disabled></div>
        <div class="field"><label>Reported Player</label><select id="reportPlayer">${options}</select></div>
        <div class="field"><label>Related Match</label><select id="reportFixture"><option value="">General / not match specific</option>${fixtureOptions}</select></div>
        <div class="field"><label>Details</label><textarea id="reportDetails" maxlength="500" placeholder="Describe what happened..." oninput="document.getElementById('reportCharCount').textContent = 500 - this.value.length"></textarea><div id="reportCharCount" style="font-size:11px; color:var(--text-dim); text-align:right; margin-top:4px;">500</div></div>
        <button class="btn pink" style="width:100%" data-action="submit-report">Send to Admin</button>
      </div>
      <div class="card">
        <h3>My Reports</h3>
        ${myReportsHtml}
      </div>
    </div>
  `;
}

/* ======================= ADMIN PANEL ======================= */
function adminHtml(){
  const sortedReports = [...reports].sort((a,b) => b.createdAt - a.createdAt);
  const reportItems = sortedReports.length ? sortedReports.map(r => {
    const reportedPlayer = playerById(r.reportedPlayerId);
    const fixture = r.fixtureId ? fixtures.find(f => f.id === r.fixtureId) : null;
    const fixtureLabel = fixture ? `Round ${fixture.round}: ${playerById(fixture.home) ? playerById(fixture.home).name : '?'} vs ${playerById(fixture.away) ? playerById(fixture.away).name : '?'}` : 'General report';
    const presetOptions = PRESET_REPLIES.map(p => `<option value="${p.key}">${esc(p.label)}</option>`).join('');
    const existingReply = r.reply ? `<div class="report-body" style="margin-top:8px; border-top:1px solid var(--line); padding-top:8px;"><strong style="color:var(--blue);">Sent reply:</strong> ${esc(r.reply.text)}</div>` : '';
    return `
      <div class="report-item ${r.resolved ? 'resolved' : ''}">
        <div class="report-head">
          <strong>${esc(r.reportingUser)} &rarr; ${esc(reportedPlayer ? reportedPlayer.name : 'Unknown')}</strong>
          <span class="tag ${r.resolved ? 'res' : ''}">${r.resolved ? 'Resolved' : 'Pending'}</span>
        </div>
        <div class="report-body">${esc(r.details)}</div>
        <div class="report-foot">${esc(fixtureLabel)} &middot; ${new Date(r.createdAt).toLocaleString()}</div>
        ${existingReply}
        <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
          ${!r.resolved ? `<button class="btn small primary" data-action="resolve-report" data-id="${r.id}">Mark Resolved</button>` : ''}
          <button class="btn small ghost" data-action="delete-report" data-id="${r.id}">Delete</button>
        </div>
        <div class="field" style="margin-top:12px; margin-bottom:6px;">
          <label>Send a Reply</label>
          <select id="replySelect-${r.id}" style="margin-bottom:8px;">${presetOptions}</select>
          <textarea id="replyCustom-${r.id}" placeholder="Optional extra note to add..." style="min-height:60px;"></textarea>
        </div>
        <button class="btn small pink" data-action="send-reply" data-id="${r.id}">Send Reply</button>
      </div>`;
  }).join('') : `<div class="empty-state">No reports in the inbox. All clear! ✅</div>`;

  const playerOptions = PLAYERS.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(p.team)})</option>`).join('');
  const penaltyItems = penalties.length ? penalties.map(pn => {
    const p = playerById(pn.playerId);
    return `<div class="penalty-item">
      <div><strong>${esc(p ? p.name : 'Unknown')}</strong> &mdash; ${esc(pn.reason)} <span style="color:var(--text-dim); font-size:11.5px;">(${new Date(pn.createdAt).toLocaleDateString()})</span></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="pts">&minus;${pn.points} pts</div>
        <button class="btn small ghost" data-action="revoke-penalty" data-id="${pn.id}">Revoke</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty-state">No penalties issued this season.</div>`;

  return `
    <div class="section-title"><div class="bar"></div><h2>Admin Panel</h2></div>
    <div class="grid cols-2">
      <div class="card">
        <h3>Score Entry</h3>
        <p style="font-size:13px; color:var(--text-dim); margin:0 0 10px;">Enter results in the <strong>Fixtures</strong> tab &mdash; standings, achievements and the dashboard update instantly for everyone.</p>
        <button class="btn primary" data-action="set-tab" data-tab="fixtures">Go to Fixtures &amp; Score Entry</button>
      </div>
      <div class="card">
        <h3>Danger Zone</h3>

        <p style="font-size:13px; color:var(--text-dim); margin:0 0 10px;">Change the shared passcodes used at login. Leave a field blank to keep it as-is.</p>
        <div class="field"><label>New Admin Passcode</label><input type="password" id="newAdminPass" placeholder="Current: hidden" maxlength="12"></div>
        <div class="field"><label>New Player Passcode (shared by all)</label><input type="password" id="newUserPass" placeholder="Current: hidden" maxlength="12"></div>
        <button class="btn primary" data-action="save-passcodes">Update Passcodes</button>
      </div>
      <div class="card">
        <h3>Share Settings</h3>
        <p style="font-size:13px; color:var(--text-dim); margin:0 0 10px;">Once this app is hosted somewhere your members can open, paste that URL here to include it in the WhatsApp share message.</p>
        <div class="field"><label>League Link</label><input type="text" id="newShareLink" placeholder="https://yourdomain.com/league" value="${esc(getShareLink())}"></div>
        <button class="btn primary" data-action="save-share-link">Save Link</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:24px;"><div class="bar"></div><h2>Penalty Box</h2></div>
    <div class="grid cols-2">
      <div class="card">
        <h3>Issue a Penalty</h3>
        <p style="font-size:13px; color:var(--text-dim); margin:0 0 10px;">Deduct points for a rule violation (max 5). This is visible to every player on the Standings tab.</p>
        <div class="field"><label>Player</label><select id="penaltyPlayer">${playerOptions}</select></div>

        <div class="field"><label>Reason / Violation</label><textarea id="penaltyReason" maxlength="200" placeholder="e.g. Confirmed cheating in Round 4"></textarea></div>
        <button class="btn pink" style="width:100%" data-action="issue-penalty">Apply Penalty</button>
      </div>
      <div class="card">
        <h3>Active Penalties</h3>
        ${penaltyItems}
      </div>
    </div>

    <div class="section-title" style="margin-top:24px;"><div class="bar"></div><h2>Manage Player Names</h2></div>
    <div class="card">
      <p style="font-size:13px; color:var(--text-dim); margin:0 0 14px;">Rename any manager below. Team assignments stay the same &mdash; only the display name changes, everywhere in the app.</p>
      <div class="grid cols-2">
        ${PLAYERS.map(p => `
          <div class="field" style="margin-bottom:10px;">
            <label>${badgeHtml(p,'sm')} <span style="vertical-align:middle;">${esc(p.team)}</span></label>
            <input type="text" data-action="name-input" data-player-id="${p.id}" value="${esc(p.name)}" maxlength="24">
          </div>`).join('')}
      </div>
      <button class="btn primary" data-action="save-names">Save Names</button>
    </div>

    <div class="section-title" style="margin-top:24px;"><div class="bar"></div><h2>Admin Inbox &middot; Reports</h2></div>
    <div class="card">${reportItems}</div>
  `;
}

/* ======================= ROSTER REQUESTS (admin) ======================= */

        This merges any <strong>approved</strong> new-player signups into the active roster (currently ${approvedCount} approved and waiting), regenerates the full fixture list so every player faces every other player home and away, and wipes all scores, reports, and penalties for a clean start. This cannot be undone.
      </p>
      <button class="btn pink" data-action="start-new-season">Start New Season</button>
    </div>
  `;
}

function savePlayerNames(newNames){
  // newNames: { [id]: name } — blank/unchanged fields are skipped, not cleared
  const updates = {};
  Object.keys(newNames).forEach(id => {
    const trimmed = (newNames[id] || '').trim();
    if(trimmed) updates[plkey(id) + '/name'] = trimmed;
  });
  if(Object.keys(updates).length === 0){ showToast('No changes to save'); return; }
  playersRef.update(updates)
    .then(() => showToast('Player names updated'))
    .catch(err => showToast('Save failed: ' + err.message));
}

/* ======================= EVENT HANDLING ======================= */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');

    if(action === 'confirm-yes'){
      el.onclick = () => {
        const cb = pendingConfirm ? pendingConfirm.onConfirm : null;
        pendingConfirm = null;
        render(); // close the modal immediately; the write itself is async
        if(cb) cb();
      };
    }
    if(action === 'confirm-no'){
      el.onclick = () => { pendingConfirm = null; render(); };
    }
    if(action === 'cancel-team-picker'){
      el.onclick = () => { teamPicker = null; render(); };
    }
    if(action === 'pick-catalog-team'){
      el.onclick = () => {
        const idx = parseInt(el.getAttribute('data-index'));
        const team = TEAM_CATALOG[idx];
        if(teamPicker && teamPicker.onPick) teamPicker.onPick(team);
      };
    }
    if(action === 'pick-role'){
      el.onclick = () => { loginRole = el.getAttribute('data-role'); loginPlayerId = null; loginError=''; render(); };
    }
    if(action === 'pick-player'){
      el.onclick = () => { loginPlayerId = parseInt(el.getAttribute('data-id')); loginError=''; render(); };
    }
    if(action === 'do-login'){
      el.onclick = doLogin;
    }
    if(action === 'toggle-signup'){
      el.onclick = () => { showSignupForm = !showSignupForm; loginError=''; signupSelectedTeam=null; render(); };
    }
    if(action === 'open-signup-team-picker'){
      el.onclick = () => {
        openTeamPicker('Choose Your Team', (team) => {
          signupSelectedTeam = team; teamPicker = null; render();
        });
      };
    }
    if(action === 'submit-new-user-request'){
      el.onclick = () => {
        const nameInput = document.getElementById('signupName');
        const detailsInput = document.getElementById('signupDetails');
        const name = nameInput.value.trim();
        if(!name){ showToast('Please enter your name'); return; }
        if(!signupSelectedTeam){ showToast('Please choose a team'); return; }
        const reqId = Date.now();
        const req = { id:reqId, name, requestedTeam:signupSelectedTeam, details: detailsInput.value.trim(), status:'pending', createdAt:Date.now() };
        newUserReqRef.child(nukey(reqId)).set(req)
          .then(() => showToast('Request submitted — the admin will review it'))
          .catch(err => showToast('Failed: ' + err.message));
        signupSelectedTeam = null;
        showSignupForm = false;
        render();
      };
    }
    if(action === 'logout'){
      el.onclick = () => {
        session = null; persistSession(); loginRole=null; loginPlayerId=null; loginError=''; activeTab='dashboard';
        render();
      };
    }
    if(action === 'set-tab'){
      el.onclick = () => { activeTab = el.getAttribute('data-tab'); render(); };
    }
    if(action === 'save-score'){
      el.onclick = () => saveScore(parseInt(el.getAttribute('data-fixture')));
    }
    if(action === 'whatsapp-share'){
      el.onclick = () => {
        const msg = el.getAttribute('data-msg');
        window.open(`https://wa.me/?text=${msg}`, '_blank');
      };
    }
    if(action === 'submit-report'){
      el.onclick = submitReport;
    }
    if(action === 'resolve-report'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        reportsRef.child(rkey(id)).update({ resolved:true })
          .then(() => showToast('Report marked resolved'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'delete-report'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        reportsRef.child(rkey(id)).remove()
          .then(() => showToast('Report deleted'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'send-reply'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        const select = document.getElementById('replySelect-' + id);
        const custom = document.getElementById('replyCustom-' + id);
        const preset = PRESET_REPLIES.find(p => p.key === select.value);
        const extra = custom.value.trim();
        const text = extra ? `${preset.text} ${extra}` : preset.text;
        reportsRef.child(rkey(id)).update({ reply: { text, presetKey: preset.key, sentAt: Date.now() } })
          .then(() => showToast('Reply sent'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'toggle-my-fixtures'){
      el.onclick = () => { fixturesFilterMine = el.getAttribute('data-mine') === 'true'; render(); };
    }
    if(action === 'save-passcodes'){
      el.onclick = () => {
        const newAdmin = document.getElementById('newAdminPass').value.trim();
        const newUser = document.getElementById('newUserPass').value.trim();
        if(!newAdmin && !newUser){ showToast('Enter at least one new passcode'); return; }
        const updates = {};
        if(newAdmin) updates.adminPass = newAdmin;
        if(newUser) updates.userPass = newUser;
        settingsRef.update(updates)
          .then(() => showToast('Passcodes updated'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'save-share-link'){
      el.onclick = () => {
        const val = document.getElementById('newShareLink').value.trim();
        settingsRef.update({ shareLink: val })
          .then(() => showToast(val ? 'Share link saved' : 'Share link cleared'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'save-names'){
      el.onclick = () => {
        const inputs = document.querySelectorAll('input[data-action="name-input"]');
        const newNames = {};
        inputs.forEach(inp => { newNames[inp.getAttribute('data-player-id')] = inp.value; });
        savePlayerNames(newNames);
      };
    }
    if(action === 'issue-penalty'){
      el.onclick = () => {
        const playerId = parseInt(document.getElementById('penaltyPlayer').value);
        let points = parseInt(document.getElementById('penaltyPoints').value);
        const reason = document.getElementById('penaltyReason').value.trim();
        if(!reason){ showToast('Enter a reason for the penalty'); return; }
        if(isNaN(points) || points < 1) points = 1;
        if(points > 5) points = 5;
        const id = Date.now();
        penaltiesRef.child(pnkey(id)).set({ id, playerId, points, reason, createdAt: Date.now() })
          .then(() => showToast('Penalty applied'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'revoke-penalty'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        penaltiesRef.child(pnkey(id)).remove()
          .then(() => showToast('Penalty revoked'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'open-team-change-picker'){
      el.onclick = () => {
        const me = playerById(session.playerId);
        openTeamPicker('Choose Your New Team', (team) => {
          teamPicker = null;
          const reqId = Date.now();
          teamReqRef.child(tckey(reqId)).set({ id:reqId, playerId: me.id, requestedTeam: team, createdAt: Date.now() })
            .then(() => showToast('Team change request sent to admin'))
            .catch(err => showToast('Failed: ' + err.message));
          render();
        });
      };
    }
    if(action === 'approve-team-request'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        const req = teamChangeRequests.find(r => r.id === id);
        if(!req) return;
        const t = req.requestedTeam;
        const updates = {};
        updates[plkey(req.playerId) + '/team'] = t.name;
        updates[plkey(req.playerId) + '/colorA'] = t.colorA;
        updates[plkey(req.playerId) + '/colorB'] = t.colorB;
        updates[plkey(req.playerId) + '/textColor'] = t.textColor || '#ffffff';
        updates[plkey(req.playerId) + '/init'] = t.init;
        playersRef.update(updates)
          .then(() => teamReqRef.child(tckey(id)).remove())
          .then(() => showToast('Team change approved'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'reject-team-request'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        teamReqRef.child(tckey(id)).remove()
          .then(() => showToast('Request rejected'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'approve-new-user'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        newUserReqRef.child(nukey(id)).update({ status:'approved' })
          .then(() => showToast('Signup approved — will join on next Start New Season'))
          .catch(err => showToast('Failed: ' + err.message));
      };
    }
    if(action === 'reject-new-user'){
      el.onclick = () => {
        const id = parseInt(el.getAttribute('data-id'));
        const req = newUserRequests.find(r => r.id === id);
        if(req && req.status === 'approved'){
          newUserReqRef.child(nukey(id)).update({ status:'pending' })
            .then(() => showToast('Approval undone'))
            .catch(err => showToast('Failed: ' + err.message));
        } else {
          newUserReqRef.child(nukey(id)).remove()
            .then(() => showToast('Request rejected'))
            .catch(err => showToast('Failed: ' + err.message));
        }
      };
    }
    if(action === 'reset-season'){
      el.onclick = () => {
        openConfirm('Reset the current season? This wipes ALL fixture scores, clears the admin inbox reports, AND clears all penalties for every device viewing this league. The roster stays the same. This cannot be undone.', () => {
          const fresh = generateFixtures();
          const obj = {};
          fresh.forEach(f => { obj[fkey(f.id)] = f; });
          Promise.all([ fixturesRef.set(obj), reportsRef.set(null), penaltiesRef.set(null) ])
            .then(() => showToast('Season reset'))
            .catch(err => showToast('Failed: ' + err.message));
        });
      };
    }
    if(action === 'start-new-season'){
      el.onclick = () => {
        const approvedCount = newUserRequests.filter(r => r.status === 'approved').length;
        openConfirm(`Start a new season? This will add ${approvedCount} approved new player(s) to the roster, regenerate the full fixture list so everyone faces everyone home and away, and wipe all scores, reports, and penalties. This cannot be undone.`, () => {
          const approved = newUserRequests.filter(r => r.status === 'approved');
          const maxId = Math.max(0, ...PLAYERS.map(p => p.id));
          const newPlayers = approved.map((r,i) => ({
            id: maxId + 1 + i, name: r.name, team: r.requestedTeam.name,
            colorA: r.requestedTeam.colorA, colorB: r.requestedTeam.colorB,
            textColor: r.requestedTeam.textColor || '#ffffff', init: r.requestedTeam.init
          }));
          const fullRoster = [...PLAYERS, ...newPlayers];
          const playersObj = {}; fullRoster.forEach(p => { playersObj[plkey(p.id)] = p; });
          const freshFixtures = generateFixturesForRoster(fullRoster.map(p => p.id));
          const fixturesObj = {}; freshFixtures.forEach(f => { fixturesObj[fkey(f.id)] = f; });
          Promise.all([
            playersRef.set(playersObj),
            fixturesRef.set(fixturesObj),
            reportsRef.set(null),
            penaltiesRef.set(null),
            newUserReqRef.set(null),
          ]).then(() => showToast('New season started!'))
            .catch(err => showToast('Failed: ' + err.message));
        });
      };
    }
  });

  const passInput = document.getElementById('passcodeInput');
  if(passInput){
    passInput.onkeydown = (e) => { if(e.key === 'Enter') doLogin(); };
  }
}

function doLogin(){
  const input = document.getElementById('passcodeInput');
  const code = input ? input.value.trim() : '';
  if(loginRole === 'admin'){
    if(code === getAdminPasscode()){
      session = { role:'admin' }; persistSession(); loginError=''; render(); showToast('Welcome, Admin');
    } else {
      loginError = 'Incorrect admin passcode.'; render();
    }
    return;
  }
  if(loginRole === 'user'){
    if(!loginPlayerId){ loginError = 'Select your player first.'; render(); return; }
    if(code === getUserPasscode()){
      session = { role:'user', playerId: loginPlayerId }; persistSession(); loginError=''; render();
      showToast('Welcome back!');
    } else {
      loginError = 'Incorrect passcode.'; render();
    }
  }
}

function saveScore(fixtureId){
  const homeInput = document.querySelector(`input[data-action="score-input"][data-fixture="${fixtureId}"][data-side="home"]`);
  const awayInput = document.querySelector(`input[data-action="score-input"][data-fixture="${fixtureId}"][data-side="away"]`);
  const hVal = homeInput.value === '' ? null : Math.max(0, parseInt(homeInput.value));
  const aVal = awayInput.value === '' ? null : Math.max(0, parseInt(awayInput.value));
  if(hVal === null || aVal === null){ showToast('Enter both scores first'); return; }
  const existing = fixtures.find(f => f.id === fixtureId);
  const alreadyPlayed = isPlayed(existing);
  const changed = alreadyPlayed && (existing.homeScore !== hVal || existing.awayScore !== aVal);
  const applyScore = () => {
    fixturesRef.child(fkey(fixtureId)).update({ homeScore:hVal, awayScore:aVal })
      .then(() => showToast('Score saved'))
      .catch(err => showToast('Save failed: ' + err.message));
  };
  if(changed){
    openConfirm(`This match already has a recorded score of ${existing.homeScore}:${existing.awayScore}. Overwrite it with ${hVal}:${aVal}? This will recalculate standings and achievements for everyone viewing the league.`, applyScore);
    return;
  }
  applyScore();
}

function submitReport(){
  const playerSel = document.getElementById('reportPlayer');
  const fixtureSel = document.getElementById('reportFixture');
  const details = document.getElementById('reportDetails');
  if(!details.value.trim()){ showToast('Please add some details'); return; }
  if(details.value.trim().length > 500){ showToast('Details must be 500 characters or fewer'); return; }
  const me = playerById(session.playerId);
  const report = {
    id: Date.now(),
    reportingUser: me.name,
    reportedPlayerId: parseInt(playerSel.value),
    fixtureId: fixtureSel.value ? parseInt(fixtureSel.value) : null,
    details: details.value.trim(),
    resolved: false,
    createdAt: Date.now(),
  };
  reportsRef.child(rkey(report.id)).set(report)
    .then(() => showToast('Report sent to Admin'))
    .catch(err => showToast('Send failed: ' + err.message));
  details.value = '';
  render();
}

/* ======================= BOOT ======================= */
render();
</script>
